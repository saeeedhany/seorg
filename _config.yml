title: SEO Reference Guide
tagline: Learn search engine optimization step by step
description: A free, structured course on search engine optimization. Learn how Google finds, understands and ranks pages, then work through technical SEO, content, links, local search and measurement in order.
url: "https://seorg.saeed.cool"
baseurl: ""
author: Saeed
lang: en

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  lessons:
    output: true
    permalink: /learn/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: lessons
    values:
      layout: lesson

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .remember
  - docs
